# PEMRIX NGINX site configuration
# Place in /etc/nginx/sites-available/pemrix and enable via sites-enabled.
# Replace __DOMAIN__ with the actual domain before enabling.

limit_req_zone $binary_remote_addr zone=pemrix_rpc:10m rate=1000r/s;
limit_req_zone $binary_remote_addr zone=pemrix_faucet:10m rate=10r/s;

# Marketing site and docs (served by Next.js on port 3000)
server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__ docs.__DOMAIN__;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name rpc.__DOMAIN__;

    location / {
        proxy_pass http://127.0.0.1:61001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rate limiting for RPC
        limit_req zone=pemrix_rpc burst=100 nodelay;
    }
}

server {
    listen 80;
    server_name explorer.__DOMAIN__;

    location / {
        proxy_pass http://127.0.0.1:61004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name faucet.__DOMAIN__;

    location / {
        proxy_pass http://127.0.0.1:61003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stricter rate limiting for faucet
        limit_req zone=pemrix_faucet burst=10 nodelay;
    }
}
