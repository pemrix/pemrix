[workspace]
members = [
    "crates/pemrix-primitives",
    "crates/pemrix-crypto",
    "crates/pemrix-storage",
    "crates/pemrix-network",
    "crates/pemrix-consensus",
    "crates/pemrix-rpc",
    "crates/pemrix-vm",
    "crates/pemrix-sdk",
    "crates/pemrix-cli",
    "crates/pemrix-ports",
    "crates/pemrix-protocol",
    "crates/pemrix-testnet",
    "crates/pemrix-faucet",
    "crates/pemrix-explorer",
    "crates/pemrix-webhooks",
    "crates/pemrix-sandbox",
    "node/pemrix-node",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["PEMRIX Labs <hello@pemrix.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/pemrix/pemrix"
homepage = "https://pemrix.com"
rust-version = "1.75"

[workspace.dependencies]
pemrix-primitives = { path = "crates/pemrix-primitives" }
pemrix-crypto = { path = "crates/pemrix-crypto" }
pemrix-storage = { path = "crates/pemrix-storage" }
pemrix-network = { path = "crates/pemrix-network" }
pemrix-consensus = { path = "crates/pemrix-consensus" }
pemrix-rpc = { path = "crates/pemrix-rpc" }
pemrix-vm = { path = "crates/pemrix-vm" }
pemrix-sdk = { path = "crates/pemrix-sdk" }
pemrix-testnet = { path = "crates/pemrix-testnet" }
pemrix-faucet = { path = "crates/pemrix-faucet" }
pemrix-explorer = { path = "crates/pemrix-explorer" }
pemrix-webhooks = { path = "crates/pemrix-webhooks" }
pemrix-sandbox = { path = "crates/pemrix-sandbox" }
pemrix-ports = { path = "crates/pemrix-ports" }

thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
hex = "0.4"
sha3 = "0.10"
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
anyhow = "1.0"
async-trait = "0.1"
axum = "0.7"
tower = "0.5"
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4.5", features = ["derive"] }
proptest = "1.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
